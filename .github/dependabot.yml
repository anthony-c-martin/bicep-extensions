version: 2
updates:
  # Type extraction and documentation generation tooling.
  - package-ecosystem: "npm"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      tools:
        patterns:
          - "*"

  # The Docusaurus site.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      website:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
